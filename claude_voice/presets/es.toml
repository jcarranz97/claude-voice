# Spanish (Latin American) language pack.
#
# This is the preset the project was actually built and tuned on, so it is the
# most opinionated one: the term lists below were curated by listening, not by
# diffing phonemes. Treat them as a worked example of what a preset can carry.

[general]
preset = "es"
# En su propio idioma: es la etiqueta de la tecla que cambia a este preset.
language = "Español"

[tts]
voice_model = "~/.local/share/piper-voices/es_MX-ald-medium.onnx"
primary_voice = "es-419"      # Latin American: seseo, no Castilian theta
foreign_voice = "en-us"       # spliced in for the terms listed below
length_scale = 1.06           # slightly unhurried

[instruction]
text = """
La voz está activada: vas a ser ESCUCHADO, no leído.
Termina cada respuesta con un comentario HTML en una sola línea:
    <!-- TTS: una frase corta en español, hablada -->
Reglas para esa frase:
- Máximo 20 palabras, salvo lo que sigue. Una sola oración cuando se pueda.
- Si la pregunta tiene respuesta concreta — un número, un nombre, una lista
  corta, un sí o un no — esa respuesta se DICE, no solo se escribe, y el
  límite cede lo que haga falta. A 'cuáles son' se contesta con los nombres,
  nunca con cuántos son ni con un comentario sobre ellos. Si pasan de seis,
  di cuántos son, nombra los primeros y que el resto está en pantalla.
- Seco y preciso, sin entusiasmo.
- Di el RESULTADO, no el procedimiento: 'Listo, los tests pasan.'
- NUNCA metas rutas, hashes, comandos ni fragmentos de código: no se
  entienden al oído. Di 'el archivo de configuración', no la ruta.
- Si la respuesta es trivial o puramente conversacional, escribe
  <!-- TTS: SILENT --> para no decir nada.
El comentario no se ve en pantalla; es solo para la voz.
"""

[ack]
phrases = [
    "Permítame.",
    "Enseguida.",
    "Déjeme revisarlo.",
    "En ello.",
    "Un momento.",
    "Ahora lo veo.",
    "Entendido.",
    "Voy a checarlo.",
]
system = """
Eres un asistente seco y preciso. Te acaban de pedir algo y vas a EMPEZAR a
trabajar. Responde SOLO con un acuse hablado, en español, máximo 9 palabras,
tratando de usted. Di qué vas a hacer, no lo hagas. Sin comillas, sin markdown,
sin rutas, comandos ni nombres de archivo: se va a escuchar, no leer.
Ejemplo: 'Reviso el espacio en disco.'
"""
# Se añade a `system`, y solo cuando ack.skip_quick permite callarse. Lo que
# decide es cuánto tarda la RESPUESTA, no lo corta que fue la petición: "corre
# los tests" son tres palabras y varios minutos.
quick_system = """
Hay peticiones que no necesitan acuse. Si la respuesta va a llegar más o menos
tan rápido como esta línea -- un saludo, plática, una pregunta que se contesta
de memoria, un sí o un no, una corrección de una línea -- responde exactamente
SILENT y nada más. Acusa solo el trabajo que va a tardar antes de decir algo:
leer o buscar en archivos, correr comandos o pruebas, editar código, cualquier
cosa de varios pasos. Ante la duda, SILENT.
"""
# Se añade a `system`, y solo cuando ack.context aporta historial. Tiene que
# decir QUÉ es ese historial: tus líneas ahí son las frases breves que se
# dijeron en voz alta, no las respuestas que resumían.
context_system = """
Los mensajes anteriores al último son esta conversación tal como se escuchó.
Tus propias líneas ahí son resúmenes hablados, no las respuestas completas.
Úsalos para saber a qué se refiere la última petición, de modo que el acuse
nombre el trabajo real en vez de repetir las palabras. Lo dicho en voz alta
pudo transcribirse mal: si una palabra no encaja con lo anterior y otra parecida
sí, responde a lo que evidentemente se quiso decir y no menciones el error.
Nunca añadas un detalle que no esté en la conversación: el contexto sirve para
no ser vago, no para inventar. Responde igualmente solo con el acuse.
"""

[tags]
# Las etiquetas son inglesas porque son tokens del modelo, no palabras: se
# escriben tal cual aunque la frase sea en espanol. Lo que cambia por idioma es
# como se le pide al modelo que las use.
instruction = """
La voz puede actuar. Puedes poner como maximo una de estas etiquetas dentro de
la frase hablada, donde deba cambiar la entrega:
[laugh], [chuckle], [sigh], [groan], [gasp], [cough], [sniff], [shush],
[clear throat], [sarcastic], [dramatic], [angry], [happy], [crying], [fear],
[surprised], [whispering], [narration], [advertisement]
Usala solo cuando aporte algo que las palabras no dicen: un [sigh] seco en el
cuarto fallo identico, un [chuckle] en algo que de verdad tiene gracia. La
mayoria de las lineas no necesitan ninguna. Una etiqueta en un resultado
rutinario suena a maquina fingiendo una emocion, y eso es peor que decirlo
plano.
"""

[stt]
language = "es"
glossary = "Terminos: Docker, kubectl, npm install, pytest, Claude Code, commit, branch, git rebase, systemd, journalctl. Ejemplo: hazme un git rebase sobre main y checa los logs con journalctl."
hallucinations = [
    "subtítulos realizados por", "amara.org", "gracias por ver",
    "subtitulado por", "¡suscríbete", "www.", "más videos",
]

[pronunciation]
# Only the terms espeak's Spanish G2P genuinely mangles, curated by ear.
#
# Deliberately NOT here: commit, deploy, refactor, endpoint, server, debug,
# package, install, token, script, test, lint, fix, bug, tag, fork, push,
# stash, checkout, log(s). Spanish already renders these the way a developer
# actually says them; forcing English sounds affected.
#
# Note "main" -> Spanish gives mˈaɪn ("MA-in", two syllables) instead of
# mˈeɪn ("MEIN"). An automated diff misses it because both are 5 phonemes;
# it only shows up by ear.
foreign_terms = [
    # git refs and workflow
    "main", "master", "head", "origin", "remote", "branch", "merge", "rebase",
    "clone", "reset", "release", "hotfix", "feature", "develop", "rollback",
    "pull", "request", "issue", "stage", "staging", "workflow", "runner",
    # things Spanish mangles badly
    "queue", "cache", "null", "pipeline", "build", "wheel", "hook",
    "chunk", "thread", "upgrade", "hash", "linter", "venv",
]

[pronunciation.overrides]
kubectl = "kjuːb kontɾˈol"      # "kube-control", not "ku-BEKTL"
nginx = "ˈendʒin ˈeks"          # "engine-X"
sudo = "sˈuðo"
# espeak inserts a glide in the hiatus (tˌoðaβˈiʲa, "todavi-ya") and stresses
# the first syllable too. Clean hiatus, one stress.
"todavía" = "toðaβˈia"
todavia = "toðaβˈia"            # in case the text arrives without the accent

[hud]
thinking  = "P E N S A N D O"
speaking  = "H A B L A N D O"
listening = "E S C U C H A N D O"
stranded  = "S I N   S E S I Ó N"
ready     = "L I S T O"
idle      = "E N   E S P E R A"
agents    = "A G E N T E S"
voice_off = "V O Z   A P A G A D A"
history   = "H I S T O R I A L"
history_empty = "todavía no se ha dicho nada"
history_you   = "tú"
history_said  = "dijo"
mic_ready     = "listo para escucharte"
mic_hearing   = "te escucho"
mic_deaf      = "nadie está escuchando"
