<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>claude-voice</title>
<link rel="stylesheet" href="/static/hud.css">
<body>
<div class="grid" hidden>

  <!-- The bar is also the title bar: dragging it moves the window and
       double-clicking it maximises, because a frameless window has nothing
       else to grab. The controls opt out of that with .no-drag. -->
  <header class="bar" id="bar">
    <div class="lhs">
      <span class="dot" id="dot"></span>
      <span class="brand" id="brand">—</span>
      <span class="mode" id="mode">standing by</span>
    </div>
    <div class="mid">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="rhs">
      <span class="badge" id="badge">VOICE OFF</span>
      <button class="win no-drag" id="close" title="close the HUD (q, or Escape)">✕</button>
    </div>
  </header>

  <!-- Left: what the machine is doing, then what was said out loud. The
       history is the panel that was already here; the stats are new, and
       they sit above it because they never change height. -->
  <section class="panel left">
    <div class="block" id="system-block">
      <h2>// system</h2>
      <div class="meter"><label>cpu</label><div class="track"><i id="cpu-bar"></i></div><b id="cpu-val">0%</b></div>
      <div class="meter"><label>ram</label><div class="track"><i id="mem-bar"></i></div><b id="mem-val">0%</b></div>
      <div class="meter"><label>disk</label><div class="track"><i id="disk-bar"></i></div><b id="disk-val">0%</b></div>
      <!-- Hidden outright when there is no readable card: three zeros look
           like a measurement, and would be the wrong one. -->
      <div class="meter" id="gpu-row" hidden><label>gpu</label><div class="track"><i id="gpu-bar"></i></div><b id="gpu-val">0%</b></div>
      <div class="meter" id="vram-row" hidden><label>vram</label><div class="track"><i id="vram-bar"></i></div><b id="vram-val">0%</b></div>
      <p class="card" id="gpu-name" hidden></p>
      <div class="tiles">
        <div class="tile"><b id="mem-abs">—</b><span>memory</span></div>
        <div class="tile"><b id="disk-abs">—</b><span>free</span></div>
        <div class="tile" id="vram-tile" hidden><b id="vram-abs">—</b><span>vram</span></div>
        <div class="tile"><b id="load-abs">—</b><span>load</span></div>
      </div>
    </div>

    <div class="block grow">
      <h2 id="history-title">// history</h2>
      <div class="log" id="history"><p class="empty" id="history-empty">nothing spoken yet</p></div>
    </div>
  </section>

  <!-- Centre: the reactor, exactly the thing the terminal HUD drew, with the
       glyph rings replaced by a shape that can actually be smooth. -->
  <main class="core">
    <svg id="reactor" viewBox="-160 -160 320 320" aria-hidden="true">
      <defs>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="a"/>
          <feGaussianBlur stdDeviation="16" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="fill">
          <stop offset="0%" stop-color="currentColor" stop-opacity=".55"/>
          <stop offset="65%" stop-color="currentColor" stop-opacity=".18"/>
          <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="halo" r="120"/>
      <circle class="halo" r="96"/>
      <!-- Only while conversation mode is armed. A dashed ring turning
           slowly around everything else: the ear being open is not a state
           of mine, so it does not take the reactor's own colour. -->
      <circle class="armed" id="armed" r="138"/>
      <circle id="core-fill" r="52" fill="url(#fill)"/>
      <!-- One per subagent, built as they appear. -->
      <g id="satellites"></g>
      <path id="blob" filter="url(#glow)"/>
    </svg>
    <!-- Whether the ear is open, which is a different question from what I
         am doing, and the one you ask before you start talking. -->
    <div class="mic" id="mic" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3"/>
        <path class="slash" d="M4 3l16 18"/>
      </svg>
      <span id="mic-word"></span>
    </div>
    <div class="state" id="state">standing by</div>
    <canvas id="wave" width="600" height="48"></canvas>
    <div class="said" id="said"></div>
  </main>

  <!-- Right: everything that can be wrong, and who is doing the work. -->
  <section class="panel right">
    <!-- What the watched session is IN. Hidden outright when that session
         is not in a repository: an empty branch row is a question, and the
         answer to it is "there is no repository", which is not worth a row. -->
    <div class="block" id="repo-block" hidden>
      <!-- The one heading with a mark on it. Every other block is named in
           words because the words are enough; this one is half a GitHub
           panel, and the mark says which half at a glance. -->
      <h2><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>// repo</h2>
      <dl class="kv">
        <dt>repo</dt><dd id="k-repo">—</dd>
        <dt>branch</dt><dd id="k-branch">—</dd>
        <dt id="k-pr-label" hidden>pull request</dt>
        <dd id="k-pr" hidden><span id="k-pr-num"></span><span class="pr-title" id="k-pr-title"></span></dd>
        <dt id="k-checks-label" hidden>checks</dt>
        <dd id="k-checks" hidden></dd>
      </dl>
    </div>

    <div class="block" id="session-block">
      <h2>// session</h2>
      <!-- Two settings, and they agree most of the time: `t` moves both. So
           they collapse into one row when they name the same pane, and split
           only when the difference is the thing worth seeing. -->
      <dl class="kv">
        <dt id="k-io-label">dictation</dt><dd id="k-io">—</dd>
        <dt id="k-voice-label" hidden>voice</dt><dd id="k-voice" hidden></dd>
        <dt>language</dt><dd id="k-lang">—</dd>
        <dt>microphone</dt><dd id="k-mic">closed</dd>
      </dl>
    </div>
    <div class="block grow" id="agents-block">
      <h2>// agents</h2>
      <ul class="agents" id="agents"><li class="empty">none running</li></ul>
    </div>
    <div class="alerts" id="alerts"></div>
  </section>

  <footer class="keys">
    <div class="ticker" id="ticker"></div>
    <div class="row" id="keys"></div>
  </footer>
</div>

<!-- Resize grips. A frameless window has no edges to grab, so the page
     lends it eight -- built only when there is a shell listening, since the
     browser fallback has a real title bar and resizes itself. -->
<div class="grips" id="grips" hidden></div>

<div class="boot" id="boot">connecting…</div>
<script src="/static/hud.js" data-token="__TOKEN__"></script>
