[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-voice"
version = "0.1.0"
description = "A local voice, an ear and a HUD for Claude Code. No cloud speech services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Carranza" }]
keywords = ["tts", "stt", "piper", "whisper", "claude-code", "voice"]
# tomllib, which the config layering is built on.
requires-python = ">=3.11"

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Everything, always. Speaking is the whole point and the ear is half of what
# this is for, so neither is behind a flag -- and anthropic is here rather than
# in an extra because the acknowledgement and the end-of-turn question are part
# of the voice.
#
# The ear used to be an `stt` extra. It cost more than it bought: an extra is
# not remembered, so any reinstall that forgot to name it silently took the
# microphone away and left a program that starts, speaks, and says there is no
# module named faster_whisper the next time you press `c`. The install is big
# now and it is the same size every time.
dependencies = [
    "piper-tts>=1.7.0",
    "anthropic>=0.40",
    "faster-whisper>=1.1",
    "onnxruntime>=1.17",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Kept, and empty. `claude-voice[stt]` is written down in scripts, in shell
# history and in older copies of the README; it now installs exactly what the
# bare name does instead of failing.
stt = []

[project.urls]
Homepage = "https://github.com/jcarranz97/claude-voice"
Issues = "https://github.com/jcarranz97/claude-voice/issues"

[project.scripts]
claude-voice = "claude_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["claude_voice"]

[tool.hatch.build.targets.sdist]
include = ["claude_voice", "README.md", "LICENSE", "install.sh", "skills"]
