[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-voice"
version = "0.1.0"
description = "A local voice, an ear and a HUD for Claude Code. No cloud speech services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Carranza" }]
keywords = ["tts", "stt", "piper", "whisper", "claude-code", "voice"]
# tomllib, which the config layering is built on.
requires-python = ">=3.11"

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Everything, always. Speaking is the whole point and the ear is half of what
# this is for, so neither is behind a flag -- and anthropic is here rather than
# in an extra because the acknowledgement and the end-of-turn question are part
# of the voice.
#
# The ear used to be an `stt` extra. It cost more than it bought: an extra is
# not remembered, so any reinstall that forgot to name it silently took the
# microphone away and left a program that starts, speaks, and says there is no
# module named faster_whisper the next time you press `c`. The install is big
# now and it is the same size every time.
dependencies = [
    "piper-tts>=1.7.0",
    "anthropic>=0.40",
    "faster-whisper>=1.1",
    "onnxruntime>=1.17",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Kept, and empty. `claude-voice[stt]` is written down in scripts, in shell
# history and in older copies of the README; it now installs exactly what the
# bare name does instead of failing.
stt = []

[project.urls]
Homepage = "https://github.com/jcarranz97/claude-voice"
Issues = "https://github.com/jcarranz97/claude-voice/issues"

[project.scripts]
claude-voice = "claude_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["claude_voice"]

[tool.hatch.build.targets.sdist]
include = ["claude_voice", "README.md", "LICENSE", "install.sh", "skills"]

# ---------------------------------------------------------------------------
# Lint, format, test.
#
# A contributor should be able to run `ruff check`, `ruff format` and `pytest`
# with no arguments and get exactly what CI runs. Nothing here is duplicated in
# the workflow file; the workflow calls these tools and this is where they are
# configured.
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
]
# The documentation site. Kept out of `dev` because it is the one group a
# contributor changing code never needs, and it is by far the heaviest.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade -- we are 3.11+, say so
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
# Every module here is also a hook entry point the host agent runs directly.
# A hook that raises is a hook that breaks somebody's editor, so the broad
# `except Exception` is the design, not an oversight -- BLE001 and friends stay
# unselected. E402 likewise: the sibling-module import has to follow the
# sys.path insert.
ignore = [
    "E402",  # module import not at top of file -- see above
    "E501",  # line length is the formatter's job, not a second opinion
    "E741",  # `l` reads fine in a two-line comprehension
    "B008",  # call in a default argument, used deliberately for config lookups
    "SIM105",  # `try/except: pass` reads better here than importing contextlib
               # into a module that must stay cheap to import
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The closure is built and called inside the same iteration of the redraw loop,
# so the late binding B023 warns about cannot happen.
"claude_voice/hud.py" = ["B023"]
# The handle is deliberately long-lived: it is the stderr a child process is
# spawned with, and closing it at the end of the block would close the log.
"claude_voice/hudcore.py" = ["SIM115"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:claude_voice.*"]

[tool.coverage.run]
source = ["claude_voice"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
