# What a pull request has to pass.
#
# Two jobs, deliberately separate: a red X should say which of the two things
# is wrong without anyone opening the log. Lint and format share a job because
# they are the same tool and take seconds; the tests are their own because they
# are the slow half.
#
# Everything here is configured in pyproject.toml, not in this file. `ruff
# check`, `ruff format --check` and `pytest` with no arguments do locally
# exactly what they do here, so a contributor can reproduce a failure without
# reading any YAML.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the run for the commit
# nobody is looking at any more is not worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: ruff check
        run: uv run --group dev ruff check --output-format=github .
      - name: ruff format
        run: uv run --group dev ruff format --check --diff .

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide what the others do. Knowing whether
      # a break is version-specific is the whole point of a matrix.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: pytest
        run: >
          uv run --group dev
          pytest --cov=claude_voice --cov-report=term-missing --cov-fail-under=95
